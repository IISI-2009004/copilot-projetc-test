# 本機手動開發／除錯專用設定（非自動化測試使用；tasks.md 追加：暫時免登入機制）。
#
# 用法：與 dev profile 疊加啟用，例如 IntelliJ Run Configuration 的
# "Active profiles" 欄位填入 dev,local，或以環境變數
# SPRING_PROFILES_ACTIVE=dev,local 啟動；不要單獨啟用 local（需與 dev 的
# H2/DataSource 設定疊加使用）。
#
# 自動化測試（*Test.java）僅使用 dev profile，不會套用本檔設定，
# 因此不影響既有的 401 未授權測試案例。

security:
  # 前端尚未完成登入頁面/JWT 串接前，未帶 Authorization 標頭的請求一律以固定測試
  # userId=1 通過驗證（見 SecurityConfig / DevNoAuthFilter）。僅限本機手動測試使用，
  # 正式環境與自動化測試皆不可開啟。
  dev-no-auth: true
