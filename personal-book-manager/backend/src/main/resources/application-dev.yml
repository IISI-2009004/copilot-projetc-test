# 開發環境設定：H2 in-memory 資料庫（需求文件 NFR：開發環境 H2）
spring:
  datasource:
    url: jdbc:h2:mem:bookmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
