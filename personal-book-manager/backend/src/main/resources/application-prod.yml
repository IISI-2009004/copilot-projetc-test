# 正式環境設定：PostgreSQL（需求文件 NFR：正式環境 PostgreSQL，Spring profile 切換）
# 所有連線資訊由環境變數注入，禁止硬編碼於原始碼/設定檔中。
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookmanager}
    username: ${DB_USERNAME:bookmanager}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false

logging:
  level:
    root: WARN
    com.iisi.bookmanager: INFO
