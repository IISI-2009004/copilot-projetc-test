name: Frontend CI

# 僅執行型別檢查/建置驗證與 Lint（不含部署）。
on:
  push:
    branches: [main, develop]
    paths:
      - "personal-book-manager/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "personal-book-manager/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: personal-book-manager/frontend

jobs:
  build:
    name: build & lint (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: personal-book-manager/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Lint (oxlint + eslint)
        run: |
          npx oxlint .
          npx eslint .
