name: Backend CI

# 僅執行測試（mvn test），不含建置產出物發佈或部署步驟。
on:
  push:
    branches: [main, develop]
    paths:
      - "personal-book-manager/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "personal-book-manager/backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: personal-book-manager/backend

jobs:
  test:
    name: mvn test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: mvn -B test

      - name: Publish test report summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend test results
          path: personal-book-manager/backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
